[project]
name = "uao-neumonia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "img2pdf>=0.6.3",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "pyautogui>=0.9.54",
    "pydicom>=3.0.2",
    "pytest>=9.1.1",
    "streamlit>=1.63.0",
    "tensorflow>=2.21.0",
    "tkcap>=0.0.4",
]

[project.scripts]
uao-neumonia = "uao_neumonia:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
